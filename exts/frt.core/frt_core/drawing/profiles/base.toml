# ------------------------------------------------------------------------------------------ drafting, not objects
max_cm = 700

[[rules]]
type = "ignore"
layer = ["*GRID*", "*AXIS*", "*EJE*", "*EJES*", "*ASSI*", "CENTER", "CEN", "*CENTRE*", "*DIM*", "*COTA*", "*QUOTE*"]
bonus = 0.1

[[rules]]
type = "ignore"
layer = ["*FILL*", "*HATCH*", "*ACHURADO*", "*RETINO*", "*TRATTEGGIO*", "*HIDDEN*", "HIDD", "*OCULT*", "*NASCOST*"]
bonus = 0.1

[[rules]]
type = "window"
layer = ["*WINDOW*", "*VENTANA*", "*FINESTRA*"]

[[rules]]
type = "product_unit"
layer = ["*PRODUCT*", "*PRODUCTO*", "*PRODOTTO*", "*MACHINE*", "*MAQUINA*", "*MACCHINA*"]
shape = "group"
min_parts = 200
size_cm = [100, 1500]                 # small scissors to booms and telehandlers (stowed)
short_cm = [50, 400]

# ------------------------------------------------------------------------------------------ people, areas
[[rules]]
type = "operator"
layer = ["*OPERATOR*", "*OPERADOR*", "*OPERATORE*", "*OPERARIO*", "*WORKER*", "*PEOPLE*"]
