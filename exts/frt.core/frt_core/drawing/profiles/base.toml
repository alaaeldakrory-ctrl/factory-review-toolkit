layer = ["*STATION*", "*ESTACION*", "*STAZIONE*", "*CELL*", "*WORKAREA*", "*PROCESO*", "*PROCESS*", "*DELIMIT*"]
shape = "rect"
size_cm = [150, 4000]
short_cm = [100, 4000]

[[rules]]
type = "area"
shape = "rect"
size_cm = [1000, 100000]
short_cm = [400, 100000]
