# ------------------------------------------------------------------------------------------ people, areas
[[rules]]
type = "operator"
layer = ["*OPERATOR*", "*OPERADOR*", "*OPERATORE*", "*OPERARIO*", "*WORKER*", "*PEOPLE*"]
size_cm = [20, 200]

[[rules]]
type = "aisle"
layer = ["*AISLE*", "*PASILLO*", "*CORRIDOIO*", "*TRAFFIC*", "*TRAFICO*"]

[[rules]]
type = "walkway"
layer = ["*WALK*", "*PEATON*", "*PEDON*", "*PED*"]

[[rules]]
type = "station_box"
layer = ["*STATION*", "*ESTACION*", "*STAZIONE*", "*CELL*", "*WORKAREA*", "*PROCESO*", "*PROCESS*", "*DELIMIT*"]
shape = "rect"
size_cm = [150, 4000]
short_cm = [100, 4000]

[[rules]]
type = "area"
shape = "rect"
size_cm = [1000, 100000]
short_cm = [400, 100000]
