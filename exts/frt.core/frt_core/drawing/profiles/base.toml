short_cm = [30, 100000]
param = { shelves = 'text:(?P<v>\d+)\s*(SHELLS?|SHELVES|ESTANTES|RIPIANI)' }
bonus = 0.05

[[rules]]
type = "parts_rack"
text = ["*RACK*", "*SHELF*", "*SHELVING*", "*ESTANTE*", "*SCAFFALE*"]
short_cm = [20, 100000]
max_cm = 3000

[[rules]]
type = "tool_cart"
text = ["*CART*", "*CARRITO*", "*CARRO*", "*CARRELLO*", "*TROLLEY*"]
short_cm = [25, 100000]
max_cm = 300

[[rules]]
type = "industrial_table"
text = ["*TABLE*", "*BENCH*", "*MESA*", "*BANCO*", "*TAVOLO*", "*BANCO DI LAVORO*", "*W. TABLE*"]
