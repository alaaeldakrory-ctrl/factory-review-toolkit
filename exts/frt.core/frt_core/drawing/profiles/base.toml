max_cm = 500

[[rules]]
type = "computer_station"
layer = ["*COMPUTER*", "*COMPUTADORA*"]
short_cm = [20, 100000]

[[rules]]
type = "ramp"
text = ["*RAMP*", "*RAMPA*"]
short_cm = [40, 100000]
max_cm = 2500

[[rules]]
type = "scale"
text = ["SCALE", "*SCALE*", "*BASCULA*", "*BÁSCULA*", "*BILANCIA*", "*PESA*"]
short_cm = [40, 100000]
max_cm = 2500

[[rules]]
type = "conveyor"
