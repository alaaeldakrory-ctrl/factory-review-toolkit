# Example process for frt_core.people: two workers, a parts table, an assembly bench and a wiring panel.
# Positions are world cm (Y up). A station is where a worker stands to work and which way they face (yaw, deg:
# 0 = facing +Z). Step targets are world points on the work; `after` lists the steps that must be finished first.
# Motions are catalog ids (exts/frt.core/frt_core/people/data/motions.toml).

[process]
name = "Bracket and harness - demo"

[[worker]]
id = "A"
body = "W50M"
start = [-250, -260]
yaw = 0

[[worker]]
id = "B"
body = "W05F"
start = [-120, -300]
yaw = 90

[[station]]
id = "parts"            # parts table: worker faces -Z
spot = [-250, -88]
yaw = 180

[[station]]
id = "bench"            # assembly bench, left half
spot = [-45, -12]
yaw = 0

[[station]]
id = "bench_right"      # assembly bench, right half
spot = [45, -12]
yaw = 0

[[station]]
id = "panel"            # wiring panel
spot = [230, -15]
yaw = 0

[[station]]
id = "floor_box"          # a 12 kg box delivered on the floor
spot = [150, -118]
yaw = 0

[[step]]
id = "fetch_bin"          # carry the bin of brackets from the parts table to the bench
worker = "A"
station = "parts"
to = "bench"
motion = "handle.carry.two_hand"
part = "bracket_bin"
size = [30, 14, 22]
look = "plastic_blue"
mass_kg = 3
pick = [-235, 97, -140]
place = [-82, 99, 30]

[[step]]
id = "tighten_1"
worker = "A"
station = "bench"
motion = "fasten.ratchet.tighten"
target = [-37, 99, 38]
strokes = 5
after = ["fetch_bin"]

[[step]]
id = "tighten_2"
worker = "A"
station = "bench"
motion = "fasten.ratchet.tighten"
target = [-53, 99, 38]
strokes = 5
after = ["tighten_1"]

[[step]]
id = "torque_1"
worker = "A"
station = "bench"
motion = "fasten.torque.final"
target = [-37, 99, 38]
after = ["tighten_2"]

[[step]]
id = "lift_box"           # floor to bench: the lifting equation should flag this
worker = "B"
station = "floor_box"
to = "bench_right"
motion = "handle.lift.floor"
part = "harness_box"
size = [40, 25, 30]
mass_kg = 12
pick = [150, 12.5, -84]
place = [80, 104.5, 30]

[[step]]
id = "connect_harness"
worker = "B"
station = "panel"
motion = "wire.connect"
target = [230, 112, 32]
axis = [0, 0, 1]

[[step]]
id = "tie_harness"
worker = "B"
station = "panel"
motion = "wire.cable_tie"
target = [248, 124, 36]
axis = [1, 0, 0]
after = ["connect_harness"]

[[step]]
id = "crimp_ground"
worker = "B"
station = "panel"
motion = "wire.crimp"
target = [215, 108, 22]
after = ["tie_harness"]

[[step]]
id = "screw_cover"
worker = "B"
station = "panel"
motion = "fasten.screwdriver.manual"
target = [212, 100, 33]
axis = [0, 0, 1]
turns = 4
after = ["crimp_ground"]

[[step]]
id = "check_bolts"
worker = "B"
station = "bench_right"
motion = "inspect.walk_around"
target = [45, 97, 38]
seconds = 2
after = ["screw_cover", "torque_1"]
