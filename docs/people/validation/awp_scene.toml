# Validation scene: three AWP assembly stations (generic shapes, no real drawings).
#   x = 0    scissor lift chassis: battery terminals low on top (y 40), connectors + harness on the front face (y 22-30)
#   x = 400  telehandler wheel hub: 5 lug studs facing the worker (hub centre y 62)
#   x = 800  boom lift platform control box: 4 cover screws + 2 connectors on its face (y 109-131)
#   x = 690  boom jib bracket overhead: 2 studs pointing down (y 172)
# Each station has its own cart with the parts bin and tools (shadow-board style).

[[spot]]
id = "chassis"
at = [0, 55]
yaw = 0

[[spot]]
id = "wheel"
at = [400, 75]
yaw = 0

[[spot]]
id = "control_box"
at = [800, 50]
yaw = 0

[[spot]]
id = "jib"
at = [690, 90]
yaw = 0

# ------------------------------------------------------------------ scissor lift chassis
[[asset]]
id = "chassis"
kind = "fixture"
