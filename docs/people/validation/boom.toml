[task]
name = "Boom platform: control box cover + connectors, jib bracket overhead"
scene = "awp_scene.toml"
worker = "C:/Nvidia_Assets/Characters_NVD/Assets/Characters/Reallusion/ActorCore/Uniform_M_0001/uniform_m_0001.usd"
start = [800, -40, 0]

[[step]]
do = "hand_start"
what = "screw"
from = "screw_bin_b"
on = "control_box.holes"
brace = "control_box.side"

[[step]]
do = "fasten"
tool = "screwdriver_b"
on = "control_box.holes"

[[step]]
do = "connect"
on = "control_box.sockets"

[[step]]
do = "hand_start"
what = "nut"
from = "nut_bin_j"
on = "jib.studs"

[[step]]
do = "fasten"
tool = "ratchet_j"
on = "jib.studs"
